name: Report a problem
description: Help reproduce a randomizer, menu, tracker or installation problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Describe the problem in your preferred language. Ctrl+Alt+D opens diagnostics; Ctrl+Alt+M marks an in-game problem."
  - type: input
    id: version
    attributes:
      label: Randomizer version
      placeholder: "For example: 2026.10.18"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      placeholder: "For example: Windows 10 x64 or Linux Mint 22.3 / X11"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Randomizer
        - Target Select
        - Normal
        - Boss Rush
        - Level Rush
        - Menu or installation
    validations:
      required: true
  - type: textarea
    id: seed
    attributes:
      label: Seed and active hacks (if available)
      description: Paste the share code from the menu or live tracker.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the level or boss and the action just before the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Debug report or screenshot (optional)
      description: Attach an exported recording or a screenshot here.
