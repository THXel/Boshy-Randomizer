name: Native source checks
on:
  push:
    paths: ['pyproject.toml', '.clang-format', 'src/**', 'assets/**', 'tests/**', 'tools/**', 'requirements/**', 'packaging/**', '.github/workflows/native-source.yml']
  pull_request:
    paths: ['pyproject.toml', '.clang-format', 'src/**', 'assets/**', 'tests/**', 'tools/**', 'requirements/**', 'packaging/**', '.github/workflows/native-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime dependencies
        run: python -m pip install pillow numpy psutil python-xlib -r requirements/development.txt
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib binutils gcc-mingw-w64-x86-64 ffmpeg
      - name: Check maintained source formatting
        run: python tools/check_style.py
      - name: Build native payloads
        run: python tools/build.py
      - name: Compile Python source
        run: python -m compileall -q build/runtime
      - name: Test source assembly protections
        run: python -m unittest discover -s tests/tooling -v
      - name: Test native runtime, routes, seeds and localization
        run: python -m unittest discover -s build/runtime/tests -v
      - name: Verify Linux and Windows package payloads
        run: |
          python packaging/build_deb.py dist
          python packaging/export_windows.py windows-payload
