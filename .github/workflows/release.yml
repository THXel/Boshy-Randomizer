name: Combined Windows and Linux release
on:
  push:
    branches: [Boshy-Randomizer]
    # Source cleanup must not silently replace an existing published release.
    paths: ['packaging/release.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-release
  cancel-in-progress: false
jobs:
  native:
    if: github.repository == 'THXel/Boshy-Randomizer' && github.ref == 'refs/heads/Boshy-Randomizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install pillow numpy psutil python-xlib
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils gcc-mingw-w64-x86-64 ffmpeg
      - name: Build native runtime
        run: python native-linux/build_runtime.py
      - name: Test runtime and localization
        run: python -m unittest discover -s native-linux/tests -v
      - name: Build game-free Linux package and Windows payload
        run: |
          python packaging/build_deb.py dist
          python packaging/export_windows.py windows-payload --version "$(python -c 'import json; print(json.load(open("packaging/release.json"))["version"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-payload
          path: windows-payload/
          if-no-files-found: error
  windows:
    needs: native
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-payload
          path: windows-payload
      - name: Build and verify Windows installer
        shell: pwsh
        run: ./packaging/build_release_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/*.exe
            dist/windows-build.json
          if-no-files-found: error
  publish:
    needs: [native, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist
      - name: Verify packages and publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish_release.py
