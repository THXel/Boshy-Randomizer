name: Publish verified current release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'THXel/Boshy-Randomizer' && github.ref == 'refs/heads/Boshy-Randomizer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the reviewed draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_release.py
