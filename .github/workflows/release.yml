name: Combined Windows and Linux release
on:
  push:
    branches: [Boshy-Randomizer]
    paths: ['packaging/release.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'THXel/Boshy-Randomizer' && github.ref == 'refs/heads/Boshy-Randomizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install pillow numpy psutil python-xlib
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils gcc-mingw-w64-x86-64 ffmpeg
      - name: Build native runtime
        run: python native-linux/build_runtime.py
      - name: Test runtime and localization
        run: python -m unittest discover -s native-linux/tests -v
      - name: Verify generated documentation
        run: |
          python packaging/render_site.py
          git diff --exit-code -- index.html site README.md README
      - name: Build game-free Linux package
        run: python packaging/build_deb.py dist
      - name: Verify Windows installer and publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/publish_release.py
